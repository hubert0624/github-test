name: Temporary High-Accuracy Whisper Model

on:
  pull_request:
    paths:
      - 'temp-large-model-trigger.txt'

permissions:
  contents: read

jobs:
  download-large-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and split official whisper.cpp large-v3-turbo quantized model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p large_model parts/part0 parts/part1
          curl -L --fail --retry 3 --retry-delay 3 \
            -o large_model/ggml-large-v3-turbo-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin?download=true'
          sha256sum large_model/ggml-large-v3-turbo-q5_0.bin | tee large_model/SHA256SUMS.txt
          split -b 280M -d -a 1 large_model/ggml-large-v3-turbo-q5_0.bin parts/model-part-
          mv parts/model-part-0 parts/part0/model-part-0
          mv parts/model-part-1 parts/part1/model-part-1
          cp large_model/SHA256SUMS.txt parts/part0/SHA256SUMS.txt
          cp large_model/SHA256SUMS.txt parts/part1/SHA256SUMS.txt
          find parts -type f -printf '%p %s bytes\n' | sort
      - name: Upload high-accuracy model part 0
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-model-part-0
          path: parts/part0
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload high-accuracy model part 1
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-model-part-1
          path: parts/part1
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
